name: Forge Factory Governance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-exposure-scan:
    name: Public exposure scan
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Forge Factory public exposure scan
        shell: pwsh
        run: >-
          ./tools/forge-factory/scan-public-exposure.ps1
          -RulesPath ./tools/forge-factory/forge-factory-rules.json
          -ReportPath ./artifacts/forge-factory-governance-report.json

      - name: Upload governance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-factory-governance-report
          path: artifacts/forge-factory-governance-report.json
          if-no-files-found: error
