<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ActionForge Prompt Builder — Tester MVP</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17231d;background:#f5f7f4}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #dde4df;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 16px rgba(0,0,0,.05)}h1{font-size:32px;line-height:1.08;margin:.2em 0}h2{font-size:22px}.sub{color:#536158}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{font-weight:700;display:block;margin:6px 0}textarea,input,select{width:100%;font:inherit;padding:12px;border:1px solid #b9c5bd;border-radius:10px;background:#fff}textarea{min-height:92px;resize:vertical}.big{min-height:130px}.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:800;font-size:17px;cursor:pointer}.primary{background:#173f2d;color:#fff}.alt{background:#e9efe9;color:#173f2d}.row{display:flex;gap:10px;flex-wrap:wrap}.score{font-size:36px;font-weight:900}.meter{height:12px;background:#e8ece9;border-radius:999px;overflow:hidden}.meter>div{height:100%;background:#173f2d;width:0}.pill{display:inline-block;border-radius:999px;background:#eef3ef;padding:6px 10px;margin:4px 4px 0 0;font-size:14px}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}h1{font-size:28px}}
</style>
</head>
<body><main class="wrap">
<section class="card"><div class="sub">ACTIONFORGE LABS | PROTECTED TESTER MVP</div><h1>Prompt Builder</h1><p>Describe what you want AI to do. The builder turns it into a clearer, reusable prompt without forcing you through a long questionnaire.</p></section>
<section class="card"><h2>1. What do you want done?</h2><label for="objective">Your request</label><textarea id="objective" class="big" placeholder="Example: Write an email to a customer explaining a two-day delivery delay without sounding defensive."></textarea><div class="row" style="margin-top:12px"><button class="btn primary" onclick="buildPrompt(false)">BUILD MY PROMPT</button><button class="btn alt" onclick="toggleExpert()">EXPERT OPTIONS</button></div></section>
<section id="expert" class="card hidden"><h2>Expert options</h2><div class="grid"><div><label>Audience</label><input id="audience" placeholder="Customer, manager, board, general public..."></div><div><label>Tone</label><select id="tone"><option value="">Choose automatically</option><option>Professional</option><option>Warm</option><option>Concise</option><option>Persuasive</option><option>Technical</option><option>Plain-language</option></select></div><div class="full"><label>Context that matters</label><textarea id="context" placeholder="Background facts the AI needs to know."></textarea></div><div><label>Output format</label><input id="format" placeholder="Email, checklist, table, plan, text message..."></div><div><label>Length / limits</label><input id="limits" placeholder="Under 200 words, 800 characters, one page..."></div><div class="full"><label>Must include / must avoid</label><textarea id="constraints" placeholder="Required points, prohibited content, legal/brand constraints, sources to use, etc."></textarea></div><div class="full"><label>Success criteria</label><textarea id="success" placeholder="What would make the result good enough to use immediately?"></textarea></div></div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="buildPrompt(true)">REBUILD WITH EXPERT OPTIONS</button></div></section>
<section id="resultCard" class="card hidden"><h2>2. Your improved prompt</h2><textarea id="result" class="big" readonly></textarea><div class="row" style="margin-top:12px"><button class="btn primary" onclick="copyPrompt()">COPY PROMPT</button><button class="btn alt" onclick="refinePrompt()">REFINE</button></div><p id="copyStatus" class="sub"></p></section>
<section id="scoreCard" class="card hidden"><h2>Prompt Quality Score</h2><div class="score"><span id="score">0</span>/100</div><div class="meter"><div id="meter"></div></div><div id="signals"></div><p id="why" class="sub"></p></section>
</main>
<script>
const byId=id=>document.getElementById(id);function toggleExpert(){byId('expert').classList.toggle('hidden');if(!byId('expert').classList.contains('hidden'))byId('expert').scrollIntoView({behavior:'smooth'});}function clean(v){return(v||'').trim()}function buildPrompt(expert){const obj=clean(byId('objective').value);if(!obj){byId('objective').focus();return}const aud=clean(byId('audience').value),tone=clean(byId('tone').value),ctx=clean(byId('context').value),fmt=clean(byId('format').value),lim=clean(byId('limits').value),con=clean(byId('constraints').value),suc=clean(byId('success').value);let parts=[];parts.push('OBJECTIVE:\n'+obj);if(ctx)parts.push('CONTEXT:\n'+ctx);if(aud)parts.push('AUDIENCE:\n'+aud);parts.push('APPROACH:\nFirst understand the objective and the important context. Make reasonable assumptions only when they are low-risk; otherwise identify the smallest missing fact that would materially change the answer. Produce the useful result directly rather than discussing how you would do it.');if(tone)parts.push('TONE:\n'+tone);if(fmt)parts.push('OUTPUT FORMAT:\n'+fmt);if(lim)parts.push('LIMITS:\n'+lim);if(con)parts.push('REQUIREMENTS / CONSTRAINTS:\n'+con);if(suc)parts.push('SUCCESS CRITERIA:\n'+suc);parts.push('QUALITY CHECK:\nBefore finalizing, check that the answer actually satisfies the objective, follows the constraints, is internally consistent, and does not invent unsupported facts.');byId('result').value=parts.join('\n\n');byId('resultCard').classList.remove('hidden');scorePrompt({obj,aud,tone,ctx,fmt,lim,con,suc,expert});byId('resultCard').scrollIntoView({behavior:'smooth'});}function scorePrompt(x){let s=35,signals=[];if(x.obj.length>30){s+=20;signals.push('Clear objective')}else signals.push('Objective could use more detail');if(x.ctx){s+=10;signals.push('Context supplied')}if(x.aud){s+=8;signals.push('Audience defined')}if(x.fmt){s+=8;signals.push('Output format defined')}if(x.lim||x.con){s+=8;signals.push('Constraints defined')}if(x.suc){s+=8;signals.push('Success criteria defined')}if(x.tone){s+=3;signals.push('Tone defined')}s=Math.min(100,s);byId('score').textContent=s;byId('meter').style.width=s+'%';byId('signals').innerHTML=signals.map(v=>'<span class="pill">'+v+'</span>').join('');byId('why').textContent=s>=85?'Strong prompt: the AI has enough structure to act with little guesswork.':s>=70?'Good prompt: usable now, with a few optional details that could improve precision.':'Usable starting point: add only the missing details that materially affect the result.';byId('scoreCard').classList.remove('hidden')}async function copyPrompt(){try{await navigator.clipboard.writeText(byId('result').value);byId('copyStatus').textContent='Copied.'}catch(e){byId('result').select();byId('copyStatus').textContent='Copy was blocked by the browser; the prompt is selected for manual copy.'}}function refinePrompt(){byId('expert').classList.remove('hidden');byId('expert').scrollIntoView({behavior:'smooth'})}
</script></body></html>
