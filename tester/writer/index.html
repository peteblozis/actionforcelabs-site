<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ActionForge Writer — Tester MVP</title><style>:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18221c;background:#f5f7f4}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #dde3df;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 16px rgba(0,0,0,.05)}h1{font-size:32px;margin:.2em 0}h2{font-size:22px}.sub{color:#5d685f}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{font-weight:700;display:block;margin:6px 0}textarea,input,select{width:100%;font:inherit;padding:12px;border:1px solid #b7c3bb;border-radius:10px;background:#fff}textarea{min-height:90px;resize:vertical}.big{min-height:150px}.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:800;font-size:17px;cursor:pointer}.primary{background:#173f2d;color:#fff}.alt{background:#eaf0eb;color:#173f2d}.row{display:flex;gap:10px;flex-wrap:wrap}.pill{display:inline-block;border-radius:999px;background:#eef3ef;padding:6px 10px;margin:4px 4px 0 0;font-size:14px}.hidden{display:none}.count{font-weight:800}.warn{color:#8a4418}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main class="wrap"><section class="card"><div class="sub">ACTIONFORGE LABS | PROTECTED TESTER MVP</div><h1>ActionForge Writer</h1><p>Turn rough notes or a draft into a send-ready message while preserving the facts you gave it.</p></section><section class="card"><h2>1. What are you working with?</h2><div class="grid"><div><label>Output type</label><select id="type"><option>Email</option><option>Text message</option><option>Letter</option><option>Memo</option><option>Reply</option><option>Post</option></select></div><div><label>Relationship</label><select id="relationship"><option>Customer</option><option>Manager / boss</option><option>Employee</option><option>Vendor</option><option>Doctor / medical office</option><option>Friend / family</option><option>Board / executive</option><option>General public</option></select></div><div><label>Tone</label><select id="tone"><option>Professional</option><option>Warm</option><option>Concise</option><option>Firm</option><option>Persuasive</option><option>Plain-language</option></select></div><div><label>Version</label><select id="version"><option>Balanced</option><option>Concise</option><option>Warmer</option><option>Stronger</option></select></div><div class="full"><label>Rough notes or current draft</label><textarea id="source" class="big" placeholder="Paste the facts, rough notes, or draft here."></textarea></div><div class="full"><label>Keep these points</label><textarea id="keep" placeholder="Names, dates, prices, promises, facts, wording that must stay accurate."></textarea></div><div class="full"><label>Avoid these points</label><textarea id="avoid" placeholder="Anything you do not want included or implied."></textarea></div><div><label>Word limit</label><input id="wordLimit" type="number" min="1" placeholder="Optional"></div><div><label>Character limit</label><input id="charLimit" type="number" min="1" placeholder="Optional"></div><div class="full"><label>Desired next action</label><input id="action" placeholder="Example: Ask them to confirm by Friday."></div></div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="buildDraft()">BUILD DRAFT</button></div></section><section id="resultCard" class="card hidden"><h2>2. Draft</h2><label>Subject</label><input id="subject" readonly><label>Message</label><textarea id="result" class="big" readonly></textarea><div><span class="pill">Words: <span id="words" class="count">0</span></span><span class="pill">Characters: <span id="chars" class="count">0</span></span><span id="limitStatus" class="pill"></span></div><p id="factStatus" class="sub"></p><div class="row" style="margin-top:12px"><button class="btn primary" onclick="copyDraft()">COPY</button><button class="btn alt" onclick="tighten()">MAKE SHORTER</button><button class="btn alt" onclick="strengthenAction()">CLARIFY NEXT ACTION</button></div><p id="copyStatus" class="sub"></p></section></main><script>const $=id=>document.getElementById(id);function txt(v){return (v||'').trim()}function sentences(s){return txt(s).split(/(?<=[.!?])\s+/).filter(Boolean)}function makeSubject(src){const t=txt(src);if(!t)return 'Message';const first=t.split(/[.!?\n]/)[0].trim();return first.length>58?first.slice(0,55)+'…':first}function normalize(s){return txt(s).replace(/\s+/g,' ')}function buildDraft(){const src=txt($('source').value);if(!src){$('source').focus();return}const keep=txt($('keep').value),avoid=txt($('avoid').value),act=txt($('action').value),tone=$('tone').value,ver=$('version').value,rel=$('relationship').value,type=$('type').value;let core=normalize(src);if(avoid){avoid.split(/\n|,/).map(x=>x.trim()).filter(Boolean).forEach(a=>{core=core.replace(new RegExp(a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),'')})}let intro='';if(type==='Email'||type==='Letter'||type==='Reply'){intro=rel==='Friend / family'?'Hi,':rel==='Doctor / medical office'?'Hello,':'Hello,'}let body=core;if(ver==='Concise'){body=sentences(core).slice(0,3).join(' ')}if(ver==='Warmer'){body='Thank you for taking the time to review this. '+body}if(ver==='Stronger'){body=body+' I want to make sure we resolve this clearly and promptly.'}if(tone==='Plain-language'){body=body.replace(/\butilize\b/gi,'use').replace(/\bcommence\b/gi,'start')}if(act){body += ' '+act}if(keep){body += '\n\nKey facts to preserve: '+normalize(keep)}let out=(intro?intro+'\n\n':'')+body;out=applyLimits(out);$('subject').value=(type==='Email'||type==='Memo'||type==='Reply')?makeSubject(src):'';$('result').value=out;updateMetrics();$('factStatus').textContent=keep?'Fact Lock active: preserved points are included explicitly for review.':'Fact Lock note: no separate locked-fact list was supplied; verify important names, dates, prices, and commitments before sending.';$('resultCard').classList.remove('hidden');$('resultCard').scrollIntoView({behavior:'smooth'})}function applyLimits(s){const wl=parseInt($('wordLimit').value||'0',10),cl=parseInt($('charLimit').value||'0',10);let out=s;if(wl>0){const w=out.split(/\s+/);if(w.length>wl)out=w.slice(0,wl).join(' ')}if(cl>0&&out.length>cl)out=out.slice(0,cl).replace(/\s+\S*$/,'').trim();return out}function updateMetrics(){const t=$('result').value;const wc=txt(t)?txt(t).split(/\s+/).length:0;$('words').textContent=wc;$('chars').textContent=t.length;const wl=parseInt($('wordLimit').value||'0',10),cl=parseInt($('charLimit').value||'0',10);let ok=true,parts=[];if(wl){const pass=wc<=wl;ok=ok&&pass;parts.push('word '+(pass?'PASS':'FAIL'))}if(cl){const pass=t.length<=cl;ok=ok&&pass;parts.push('char '+(pass?'PASS':'FAIL'))}$('limitStatus').textContent=parts.length?(ok?'Limits PASS':'Limits FAIL'):'No hard limit';$('limitStatus').className='pill'+(ok?'':' warn')}async function copyDraft(){let t='';if(txt($('subject').value))t='Subject: '+$('subject').value+'\n\n';t+=$('result').value;try{await navigator.clipboard.writeText(t);$('copyStatus').textContent='Copied.'}catch(e){$('result').select();$('copyStatus').textContent='Browser blocked copy; message selected.'}}function tighten(){let s=sentences($('result').value);if(s.length>2)s=s.slice(0,Math.max(2,Math.ceil(s.length*.65)));$('result').value=applyLimits(s.join(' '));updateMetrics()}function strengthenAction(){const a=txt($('action').value);if(!a){$('copyStatus').textContent='Add the desired next action above, then click again.';return}let r=$('result').value;if(!r.toLowerCase().includes(a.toLowerCase()))r += '\n\nNext step: '+a;$('result').value=applyLimits(r);updateMetrics()}</script></body></html>
